apiVersion: apps/v1
kind: Deployment
metadata:
  name: #{CRON_KUBERNETES_DEPLOYMENT_NAME}#
  labels:
    app: #{CRON_KUBERNETES_DEPLOYMENT_NAME}#
    type: application
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: #{CRON_KUBERNETES_DEPLOYMENT_NAME}#
      type: application
  template:
    metadata:
      labels:
        app: #{CRON_KUBERNETES_DEPLOYMENT_NAME}#
        type: application
    spec:
      terminationGracePeriodSeconds: #{DEPLOYMENT_CRON_TERMINATION_GRACE_PERIOD_SECONDS}#
      containers:
        - name: #{CRON_KUBERNETES_DEPLOYMENT_NAME}#
          image: petitpress.azurecr.io/#{CRON_DOCKER_IMAGE_REPOSITORY}#:#{VERSION}#
          imagePullPolicy: Always
          lifecycle:
            preStop:
              exec:
                command: ["/bin/bash", "-c", "pre-stop-cron-container"]
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
          resources:
            limits:
              cpu: #{DEPLOYMENT_CRON_CPU_LIMIT}#
              memory: #{DEPLOYMENT_CRON_MEMORY_LIMIT}#
            requests:
              cpu: #{DEPLOYMENT_CRON_CPU_REQUEST}#
              memory: #{DEPLOYMENT_CRON_MEMORY_REQUEST}#
          envFrom:
            - configMapRef:
                name: #{APP_NAME}#
            - secretRef:
                name: #{APP_NAME}#
          env:
            - name: AZURE_DEPLOYMENT_START_TIME
              value: #{SYSTEM_PIPELINESTARTTIME}#
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: #{APP_NAME}#-infra
                  key: redis_host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: #{APP_NAME}#-infra
                  key: redis_port
            - name: REDIS_CACHE_HOST
              valueFrom:
                configMapKeyRef:
                  name: #{APP_NAME}#-infra
                  key: redis_cache_host
            - name: REDIS_CACHE_PORT
              valueFrom:
                configMapKeyRef:
                  name: #{APP_NAME}#-infra
                  key: redis_cache_port
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
            - name: secure-credentials
              mountPath: /var/www/html/var/secure
              readOnly: true
          livenessProbe:
            exec:
              command:
                - cat
                - /var/run/crond.pid
            initialDelaySeconds: 10
            periodSeconds: 10
        - name: anzu-dam-asset-file-clear-log
          image: busybox
          command: [ "/bin/sh", "-c" ]
          args: [ "/var/www/html/var/log/tail-cmd -f /var/www/html/var/log/anzu_dam_asset_file_clear.log" ]
          resources:
            limits:
              cpu: 5m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 5Mi
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
        - name: anzu-dam-asset-clear-log
          image: busybox
          command: [ "/bin/sh", "-c" ]
          args: [ "/var/www/html/var/log/tail-cmd -f /var/www/html/var/log/anzu_dam_asset_clear.log" ]
          resources:
            limits:
              cpu: 5m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 5Mi
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
        - name: podcast-generate-import-job-log
          image: busybox
          command: ["/bin/sh", "-c"]
          args: ["/var/www/html/var/log/tail-cmd -f /var/www/html/var/log/podcast_generate_import_job.log"]
          resources:
            limits:
              cpu: 5m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 5Mi
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
        - name: process-job-log
          image: busybox
          command: ["/bin/sh", "-c"]
          args: ["/var/www/html/var/log/tail-cmd -f /var/www/html/var/log/process_job.log"]
          resources:
            limits:
              cpu: 5m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 5Mi
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
        - name: container-stop-log
          image: busybox
          command: ["/bin/sh", "-c"]
          args: ["/var/www/html/var/log/tail-cmd -f /var/www/html/var/log/container_stop.log"]
          resources:
            limits:
              cpu: 5m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 5Mi
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
        - name: redis-expire-cache-db-log
          image: busybox
          command: ["/bin/sh", "-c"]
          args: ["/var/www/html/var/log/tail-cmd -f /var/www/html/var/log/redis_expire_cache_db.log"]
          resources:
            limits:
              cpu: 5m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 5Mi
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
      imagePullSecrets:
        - name: acr-regcred
      volumes:
        - name: logs
          emptyDir: {}
        - name: secure-credentials
          secret:
            secretName: #{APP_NAME}#-infra
            items:
              - key: central-oauth2-public-key.pem
                path: sso/central-oauth2-public-key.pem
              - key: central-oauth2-web-public-key.pem
                path: sso/central-oauth2-web-public-key.pem
              - key: dam-general-prod-storage-bucket-credentials.json
                path: google/general-production-storage-bucket-credentials.json
              - key: dam-general-storage-bucket-credentials.json
                path: google/general-storage-bucket-credentials.json
              - key: dam-mediaapi-prod-ro-storage-bucket-credentials.json
                path: google/mediaapi-production-storage-bucket-credentials.json
              - key: dam-mediaapi-ro-storage-bucket-credentials.json
                path: google/mediaapi-storage-bucket-credentials.json
              - key: dam-ro-production-storage-bucket-credentials.json
                path: google/fallback-storage-bucket-credentials.json
              - key: dam-storage-bucket-credentials.json
                path: google/storage-bucket-credentials.json
              - key: google-pubsub-credentials.json
                path: google/pubsub-credentials.json
              - key: dam-youtube-oauth2-credentials.json
                path: youtube/yt_oauth2_credentials.json
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: #{CRON_KUBERNETES_DEPLOYMENT_NAME}#
  labels:
    app: #{CRON_KUBERNETES_DEPLOYMENT_NAME}#
    type: application
spec:
  minAvailable: #{PDB_CRON_MIN_AVAILABLE}#
  selector:
    matchLabels:
      app: #{CRON_KUBERNETES_DEPLOYMENT_NAME}#
