apiVersion: v1
kind: ConfigMap
metadata:
  name: #{APP_NAME}#
  labels:
    app: #{APP_NAME}#
    type: application
data:
  ANZU_MONGODB_APP_LOG_DB: "#{ANZU_MONGODB_APP_LOG_DB}#"
  ANZU_MONGODB_APP_LOG_SSL: "#{ANZU_MONGODB_APP_LOG_SSL}#"
  ANZU_MONGODB_APP_LOG_URI: "#{ANZU_MONGODB_APP_LOG_URI}#"
  ANZU_MONGODB_APP_LOG_USERNAME: "#{ANZU_MONGODB_APP_LOG_USERNAME}#"
  ANZU_MONGODB_AUDIT_LOG_DB: "#{ANZU_MONGODB_AUDIT_LOG_DB}#"
  ANZU_MONGODB_AUDIT_LOG_SSL: "#{ANZU_MONGODB_AUDIT_LOG_SSL}#"
  ANZU_MONGODB_AUDIT_LOG_URI: "#{ANZU_MONGODB_AUDIT_LOG_URI}#"
  ANZU_MONGODB_AUDIT_LOG_USERNAME: "#{ANZU_MONGODB_AUDIT_LOG_USERNAME}#"
  ANZU_NOTIFICATION_DOMAIN: "#{ANZU_NOTIFICATION_DOMAIN}#"
  APP_DEBUG: "#{APP_DEBUG}#"
  APP_ENV: "#{APP_ENV}#"
  APP_HOST: "#{APP_HOST}#"
  APP_TRUSTED_PROXIES: "#{APP_TRUSTED_PROXIES}#"
  COOKIE_DOMAIN: "#{COOKIE_DOMAIN}#"
  COOKIE_SECURE: "#{COOKIE_SECURE}#"
  CRON_KILL_TIMEOUT: "#{CRON_KILL_TIMEOUT}#"
  CRON_TERM_TIMEOUT: "#{CRON_TERM_TIMEOUT}#"
  DOCTRINE_CACHE_ENABLED: "#{DOCTRINE_CACHE_ENABLED}#"
  DOMAIN_ADMIN_WEB: "#{DOMAIN_ADMIN_WEB}#"
  DOMAIN_CMS_WEB: "#{DOMAIN_CMS_WEB}#"
  FIXTURES_ENV: "#{FIXTURES_ENV}#"
  GCLOUD_PROJECT: "#{GCLOUD_PROJECT}#"
  GOOGLE_APPLICATION_CREDENTIALS: "/var/www/html/var/secure/google/pubsub-credentials.json"
  GOOGLE_BUCKET_CREDENTIALS: "/var/www/html/var/secure/google/storage-bucket-credentials.json"
  GOOGLE_FALLBACK_BUCKET_CREDENTIALS: "/var/www/html/var/secure/google/fallback-storage-bucket-credentials.json"
  IMAGE_ADMIN_CC_TTL: "#{IMAGE_ADMIN_CC_TTL}#"
  IMAGE_ADMIN_MAX_AGE: "#{IMAGE_ADMIN_MAX_AGE}#"
  IMAGE_PUBLIC_CC_TTL: "#{IMAGE_PUBLIC_CC_TTL}#"
  IMAGE_PUBLIC_MAX_AGE: "#{IMAGE_PUBLIC_MAX_AGE}#"
  MESSENGER_TRANSPORT_DSN: "#{MESSENGER_TRANSPORT_DSN}#"
  NGINX_ACCESS_LOG: "/var/www/html/var/log/nginx_access.log main"
  NGINX_ALLOWED_ORIGINS_REGEX: "#{NGINX_ALLOWED_ORIGINS_REGEX}#"
  NGINX_CLIENT_BODY_BUFFER_SIZE: "#{NGINX_CLIENT_BODY_BUFFER_SIZE}#"
  NGINX_CLIENT_MAX_BODY_SIZE: "#{NGINX_CLIENT_MAX_BODY_SIZE}#"
  NGINX_ERROR_LOG: "/var/www/html/var/log/nginx_error.log warn"
  NGINX_STATIC_LOCATION_REGEX: "\\.(gif|ico|css|js|svg|bmp|eot|woff|woff2|ttf)$$"
  PHP_ACCESS_LOG: "/var/www/html/var/log/fpm_access.log"
  PHP_ERROR_LOG: "/var/www/html/var/log/fpm_error.log"
  PHP_MEMORY_LIMIT: "#{PHP_MEMORY_LIMIT}#"
  PHP_OPCACHE_PRELOAD_PATH: "/var/www/html/var/cache/prod/App_KernelProdContainer.preload.php"
  PHP_PM_MAX_CHILDREN: "#{PHP_PM_MAX_CHILDREN}#"
  PHP_SLOW_LOG: "/var/www/html/var/log/fpm_error.log"
  PUBLIC_IMAGE_ADMIN_DOMAIN: "#{PUBLIC_IMAGE_ADMIN_DOMAIN}#"
  PUBLIC_IMAGE_DOMAIN: "#{PUBLIC_IMAGE_DOMAIN}#"
  PUBSUB_EMULATOR_HOST: ""
  PURGE_CACHE_XKEY_ENABLED: "#{PURGE_CACHE_XKEY_ENABLED}#"
  PURGE_CDN_ENABLED: "#{PURGE_CDN_ENABLED}#"
  SECURE_CHANNEL: "#{SECURE_CHANNEL}#"
  SSO_CLIENT_ID: "#{SSO_CLIENT_ID}#"
  SSO_PUBLIC_CERT_PATH: "/var/www/html/var/secure/sso/central-oauth2-public-key.pem"
  SSO_USER_INFO_URL: "#{SSO_USER_INFO_URL}#"
---
apiVersion: v1
kind: Secret
metadata:
  name: #{APP_NAME}#
  labels:
    app: #{APP_NAME}#
    type: application
type: Opaque
stringData:
  ANZU_MONGODB_APP_LOG_PASSWORD: "#{ANZU_MONGODB_APP_LOG_PASSWORD}#"
  ANZU_MONGODB_AUDIT_LOG_PASSWORD: "#{ANZU_MONGODB_AUDIT_LOG_PASSWORD}#"
  APP_SECRET: "#{APP_SECRET}#"
  ARTEMIS_API_TOKEN: "#{ARTEMIS_API_TOKEN}#"
  DB_CORE_DAM_URL: "mysql://#{DB_CORE_DAM_USER}#:#{DB_CORE_DAM_PASS}#@#{DB_CORE_DAM_HOST}#:#{DB_CORE_DAM_PORT}#/#{DB_CORE_DAM_NAME}#?serverVersion=#{DB_SERVER_VERSION}#"
