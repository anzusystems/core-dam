apiVersion: apps/v1
kind: Deployment
metadata:
  name: #{APP_KUBERNETES_DEPLOYMENT_NAME}#
  labels:
    app: #{APP_KUBERNETES_DEPLOYMENT_NAME}#
    type: application
spec:
  revisionHistoryLimit: 2
  progressDeadlineSeconds: #{DEPLOYMENT_APP_PROGRESS_DEADLINE_SECONDS}#
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: #{DEPLOYMENT_APP_ROLLING_UPDATE_MAX_SURGE}#
      maxUnavailable: 0
  selector:
    matchLabels:
      app: #{APP_KUBERNETES_DEPLOYMENT_NAME}#
      type: application
  template:
    metadata:
      labels:
        app: #{APP_KUBERNETES_DEPLOYMENT_NAME}#
        type: application
    spec:
      terminationGracePeriodSeconds: #{DEPLOYMENT_APP_TERMINATION_GRACE_PERIOD_SECONDS}#
      containers:
        - name: #{APP_KUBERNETES_DEPLOYMENT_NAME}#
          image: petitpress.azurecr.io/#{APP_DOCKER_IMAGE_REPOSITORY}#:#{VERSION}#
          imagePullPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
          lifecycle:
            preStop:
              exec:
                command: ["/bin/bash", "-c", "pre-stop-container --messengers"]
          resources:
            limits:
              cpu: #{DEPLOYMENT_APP_CPU_LIMIT}#
              memory: #{DEPLOYMENT_APP_MEMORY_LIMIT}#
            requests:
              cpu: #{DEPLOYMENT_APP_CPU_REQUEST}#
              memory: #{DEPLOYMENT_APP_MEMORY_REQUEST}#
          envFrom:
            - configMapRef:
                name: #{APP_NAME}#
            - secretRef:
                name: #{APP_NAME}#
          env:
            - name: AZURE_DEPLOYMENT_START_TIME
              value: #{SYSTEM_PIPELINESTARTTIME}#
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: anzu-config
                  key: redis_host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: anzu-config
                  key: redis_port
            - name: REDIS_CACHE_HOST
              valueFrom:
                configMapKeyRef:
                  name: anzu-config
                  key: redis_cache_host
            - name: REDIS_CACHE_PORT
              valueFrom:
                configMapKeyRef:
                  name: anzu-config
                  key: redis_cache_port
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
            - name: secure-credentials
              mountPath: /var/www/html/var/secure
              readOnly: true
          ports:
            - name: application
              containerPort: 8080
            - name: healthcheck
              containerPort: 9999
          livenessProbe:
            tcpSocket:
              port: application
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              port: healthcheck
              path: /status-nginx
            initialDelaySeconds: 30
            periodSeconds: 5
        - name: container-stop-log
          image: busybox
          command: ["/bin/sh", "-c"]
          args: ["/var/www/html/var/log/tail-cmd -f /var/www/html/var/log/container_stop.log"]
          resources:
            limits:
              cpu: 5m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 5Mi
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
        - name: fpm-access-log
          image: busybox
          command: ["/bin/sh", "-c"]
          args: ["/var/www/html/var/log/tail-cmd -f /var/www/html/var/log/fpm_access.log"]
          resources:
            limits:
              cpu: 5m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 5Mi
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
        - name: fpm-error-log
          image: busybox
          command: ["/bin/sh", "-c"]
          args: ["/var/www/html/var/log/tail-cmd -f /var/www/html/var/log/fpm_error.log -o stderr"]
          resources:
            limits:
              cpu: 5m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 5Mi
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
        - name: messenger-anzu-core-image-file-change-state-log
          image: busybox
          command: ["/bin/sh", "-c"]
          args: ["/var/www/html/var/log/tail-cmd -f /var/www/html/var/log/messenger_anzu_core_dam_image_file_change_state.log"]
          resources:
            limits:
              cpu: 5m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 5Mi
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
        - name: messenger-anzu-core-video-file-change-state-log
          image: busybox
          command: [ "/bin/sh", "-c" ]
          args: [ "/var/www/html/var/log/tail-cmd -f /var/www/html/var/log/messenger_anzu_core_dam_video_file_change_state.log" ]
          resources:
            limits:
              cpu: 5m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 5Mi
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
        - name: messenger-anzu-core-audio-file-change-state-log
          image: busybox
          command: [ "/bin/sh", "-c" ]
          args: [ "/var/www/html/var/log/tail-cmd -f /var/www/html/var/log/messenger_anzu_core_dam_audio_file_change_state.log" ]
          resources:
            limits:
              cpu: 5m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 5Mi
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
        - name: messenger-anzu-core-document-file-change-state-log
          image: busybox
          command: [ "/bin/sh", "-c" ]
          args: [ "/var/www/html/var/log/tail-cmd -f /var/www/html/var/log/messenger_anzu_core_dam_document_file_change_state.log" ]
          resources:
            limits:
              cpu: 5m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 5Mi
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
        - name: messenger-core-dam-log-log
          image: busybox
          command: ["/bin/sh", "-c"]
          args: ["/var/www/html/var/log/tail-cmd -f /var/www/html/var/log/messenger_core_dam_log.log"]
          resources:
            limits:
              cpu: 5m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 5Mi
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
        - name: messenger-anzu-core-asset-change-state-log
          image: busybox
          command: [ "/bin/sh", "-c" ]
          args: [ "/var/www/html/var/log/tail-cmd -f /var/www/html/var/log/messenger_anzu_core_asset_change_state.log" ]
          resources:
            limits:
              cpu: 5m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 5Mi
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
        - name: messenger-anzu-core-asset-file-change-state-log
          image: busybox
          command: [ "/bin/sh", "-c" ]
          args: [ "/var/www/html/var/log/tail-cmd -f /var/www/html/var/log/messenger_anzu_core_asset_file_change_state.log" ]
          resources:
            limits:
              cpu: 5m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 5Mi
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
        - name: nginx-access-log
          image: busybox
          command: ["/bin/sh", "-c"]
          args: ["/var/www/html/var/log/tail-cmd -f /var/www/html/var/log/nginx_access.log"]
          resources:
            limits:
              cpu: 5m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 5Mi
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
        - name: nginx-error-log
          image: busybox
          command: ["/bin/sh", "-c"]
          args: ["/var/www/html/var/log/tail-cmd -f /var/www/html/var/log/nginx_error.log -o stderr"]
          resources:
            limits:
              cpu: 5m
              memory: 10Mi
            requests:
              cpu: 1m
              memory: 5Mi
          volumeMounts:
            - name: logs
              mountPath: /var/www/html/var/log
      imagePullSecrets:
        - name: acr-regcred
      volumes:
        - name: logs
          emptyDir: {}
        - name: secure-credentials
          secret:
            secretName: anzu-infra
            items:
              - key: central-oauth2-public-key.pem
                path: sso/central-oauth2-public-key.pem
              - key: central-oauth2-web-public-key.pem
                path: sso/central-oauth2-web-public-key.pem
              - key: dam-ro-production-storage-bucket-credentials.json
                path: google/fallback-storage-bucket-credentials.json
              - key: dam-storage-bucket-credentials.json
                path: google/storage-bucket-credentials.json
              - key: google-pubsub-credentials.json
                path: google/pubsub-credentials.json
              - key: dam-youtube-oauth2-credentials.json
                path: youtube/yt_oauth2_credentials.json
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: #{APP_KUBERNETES_DEPLOYMENT_NAME}#
  labels:
    app: #{APP_KUBERNETES_DEPLOYMENT_NAME}#
    type: application
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: #{APP_KUBERNETES_DEPLOYMENT_NAME}#
  minReplicas: #{HPA_APP_MIN_REPLICA_COUNT}#
  maxReplicas: #{HPA_APP_MAX_REPLICA_COUNT}#
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: #{HPA_APP_AVERAGE_CPU_UTILIZATION}#
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: #{APP_KUBERNETES_DEPLOYMENT_NAME}#
  labels:
    app: #{APP_KUBERNETES_DEPLOYMENT_NAME}#
    type: application
spec:
  minAvailable: #{PDB_APP_MIN_AVAILABLE}#
  selector:
    matchLabels:
      app: #{APP_KUBERNETES_DEPLOYMENT_NAME}#
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: #{APP_KUBERNETES_DEPLOYMENT_NAME}#
  labels:
    app: #{APP_KUBERNETES_DEPLOYMENT_NAME}#
    type: application
spec:
  timeoutSec: #{GOOGLE_BACKEND_CONFIG_TIMEOUT_SEC}#
  healthCheck:
    checkIntervalSec: 5
    timeoutSec: 5
    type: HTTP
    requestPath: /status-nginx
    port: 9999
---
apiVersion: v1
kind: Service
metadata:
  name: #{APP_KUBERNETES_DEPLOYMENT_NAME}#
  labels:
    app: #{APP_KUBERNETES_DEPLOYMENT_NAME}#
    type: application
  annotations:
    cloud.google.com/backend-config: '{"default":"#{APP_KUBERNETES_DEPLOYMENT_NAME}#"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: NodePort
  selector:
    app: #{APP_KUBERNETES_DEPLOYMENT_NAME}#
    type: application
  ports:
    - name: application
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: healthcheck
      protocol: TCP
      port: 9999
      targetPort: 9999
