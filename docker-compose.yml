services:
  core-dam:
    build:
      args:
        - DOCKER_USER=${DOCKER_USER:-user}
        - DOCKER_USER_ID=${DOCKER_USER_ID:-1000}
        - DOCKER_GROUP_ID=${DOCKER_GROUP_ID:-1000}
      context: .
      dockerfile: ./docker/app/local/Dockerfile
    environment:
      - VIRTUAL_HOST=core-dam.sme.localhost,image.smedata.localhost,admin-image.smedata.localhost
      - VIRTUAL_PORT=${NGINX_PORT:-8130}
      - NGINX_PORT=${NGINX_PORT:-8130}
    external_links:
      - local-proxy:core-dam.sme.localhost
      - local-proxy:central.sme.localhost
    env_file:
      - .env.docker.dist
      - .env.docker.local
    secrets:
      - ssh_private_key
    volumes:
      - .:/var/www/html:cached
      - ./tests/coverage:/opt/phpstorm-coverage:cached
    ports:
      - ${NGINX_PORT:-8130}:${NGINX_PORT:-8130}
    hostname: core-dam
    networks:
      - ${DOCKER_NETWORK_NAME:-petitpress_network}

  core-dam-cron:
    build:
      args:
        - DOCKER_USER=${DOCKER_USER:-user}
        - DOCKER_USER_ID=${DOCKER_USER_ID:-1000}
        - DOCKER_GROUP_ID=${DOCKER_GROUP_ID:-1000}
      context: .
      dockerfile: ./docker/app-cron/local/Dockerfile
    external_links:
      - local-proxy:core-dam.sme.localhost
    env_file:
      - .env.docker.dist
      - .env.docker.local
    volumes:
      - .:/var/www/html:cached
    hostname: core-dam-cron
    networks:
      - ${DOCKER_NETWORK_NAME:-petitpress_network}

  mysql-core-dam:
    image: mysql:8.0.30
    command:
      - --default-authentication-plugin=mysql_native_password
      - --disable-log-bin
    env_file:
      - .env.docker.dist
      - .env.docker.local
    volumes:
      - mysql_local_data:/var/lib/mysql:cached
    ports:
      - ${MYSQL_DOCKER_PORT:-3353}:3306
    hostname: mysql-core-dam
    networks:
      - ${DOCKER_NETWORK_NAME:-petitpress_network}

  redis-core-dam:
    image: redis:6.2.7
    volumes:
      - redis_local_data:/data:cached
    ports:
      - ${REDIS_DOCKER_PORT:-6571}:6379
    hostname: redis-core-dam
    networks:
      - ${DOCKER_NETWORK_NAME:-petitpress_network}

  elasticsearch-core-dam:
    image: petitpress.azurecr.io/elasticsearch:3.1.0-vocabulary
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=false
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_local_data:/usr/share/elasticsearch/data:cached
    ports:
      - ${ELASTICSEARCH_DOCKER_PORT:-9225}:9200
    hostname: elasticsearch-core-dam
    networks:
      - ${DOCKER_NETWORK_NAME:-petitpress_network}

  mongo-core-dam:
    image: mongo:5.0.12
    command: ${MONGO_LOGAPPEND:-} ${MONGO_NOTABLESCAN:-}
    env_file:
      - .env.docker.dist
      - .env.docker.local
    volumes:
      - mongo_local_data:/data/db:cached
    ports:
      - ${MONGO_DOCKER_PORT:-27517}:27017
    hostname: mongo-core-dam
    networks:
      - ${DOCKER_NETWORK_NAME:-petitpress_network}

  pubsub-core-dam:
    image: petitpress.azurecr.io/gcloud-pubsub-emulator:4.1.0
    env_file:
      - .env.docker.dist
      - .env.docker.local
    external_links:
      - local-proxy:smsgw.sme.localhost
    ports:
      - ${PUBSUB_DOCKER_PORT:-8238}:8538
    hostname: pubsub-core-dam
    networks:
      - ${DOCKER_NETWORK_NAME:-petitpress_network}

secrets:
  ssh_private_key:
    file: ${DOCKER_SSH_PRV_KEY_FILE:-~/.ssh/id_rsa}

volumes:
  mysql_local_data:
    driver: local

  redis_local_data:
    driver: local

  elasticsearch_local_data:
    driver: local

  mongo_local_data:
    driver: local

networks:
  petitpress_network:
    external: true
