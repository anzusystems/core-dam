anzu_common:
    settings:
        app_redis: DamRedis
        app_cache_proxy_enabled: true
        user_entity_class: App\Entity\User
        app_entity_namespace: App\Entity
        app_value_object_namespace: App\Model\ValueObject
        unlocked_commands:
            - Symfony\Bundle\FrameworkBundle\Command\AssetsInstallCommand
            - Symfony\Bundle\FrameworkBundle\Command\CacheWarmupCommand
            - Symfony\Component\Messenger\Command\ConsumeMessagesCommand
    health_check:
        enabled: true
        mysql_table_name: _doctrine_migration_versions
        mongo_collections: [anzu_mongo_app_log_collection, anzu_mongo_audit_log_collection]
        modules:
            - Anzu\CommonBundle\HealthCheck\Module\OpCacheModule
            - Anzu\CommonBundle\HealthCheck\Module\ForwardIpModule
            - Anzu\CommonBundle\HealthCheck\Module\MysqlModule
            - Anzu\CommonBundle\HealthCheck\Module\MongoModule
            - Anzu\CommonBundle\HealthCheck\Module\RedisModule
            - Anzu\CommonBundle\HealthCheck\Module\DataMountModule
    errors:
        enabled: true
        only_uri_match:
          - ^/api/
        default_exception_handler: Anzu\CommonBundle\Exception\Handler\DefaultExceptionHandler
        exception_handlers:
            - Anzu\CommonBundle\Exception\Handler\NotFoundExceptionHandler
            - Anzu\CommonBundle\Exception\Handler\ValidationExceptionHandler
            - Anzu\CommonBundle\Exception\Handler\AppReadOnlyModeExceptionHandler
            - Anzu\CommonBundle\Exception\Handler\AccessDeniedExceptionHandler
    logs:
        enabled: true
        messenger_transport:
            name: 'core_dam_log'
            dsn: '%env(MESSENGER_TRANSPORT_DSN)%?topic[name]=core_dam_log'
        app:
            mongo:
                uri: '%env(ANZU_MONGODB_APP_LOG_URI)%'
                username: '%env(ANZU_MONGODB_APP_LOG_USERNAME)%'
                password: '%env(ANZU_MONGODB_APP_LOG_PASSWORD)%'
                database: '%env(ANZU_MONGODB_APP_LOG_DB)%'
                ssl: '%env(bool:ANZU_MONGODB_APP_LOG_SSL)%'
                collection: appLogs
        # Audit log section
        audit:
            # Mongo connection definition
            mongo:
                uri: '%env(ANZU_MONGODB_AUDIT_LOG_URI)%'
                username: '%env(ANZU_MONGODB_AUDIT_LOG_USERNAME)%'
                password: '%env(ANZU_MONGODB_AUDIT_LOG_PASSWORD)%'
                database: '%env(ANZU_MONGODB_AUDIT_LOG_DB)%'
                ssl: '%env(bool:ANZU_MONGODB_AUDIT_LOG_SSL)%'
                collection: auditLogs
            logged_methods: ['POST', 'PUT', 'PATCH', 'DELETE']
    anzu_serializer:
        enabled: true
        # Default date format to use for (de)serialization.
        date_format: 'Y-m-d\\TH:i:s.u\\Z'
