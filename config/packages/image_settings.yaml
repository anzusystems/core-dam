          - { width: 800, height: 450 }   # anzu web general
          - { width: 350, height: 197 }   # anzu web box item photo
          - { width: 1000, height: 0 }    # web article detail image set (automatic height)
          - { width: 970, height: 0 }     # web article detail image set (automatic height)
          - { width: 625, height: 0 }     # web article detail image set (automatic height)
          - { width: 448, height: 0 }     # web article detail image set (automatic height)
          - { width: 300, height: 0 }     # web article detail image set (automatic height)
          - { width: 288, height: 0 }     # web article detail image set (automatic height)
          - { width: 972, height: 648 }   # web list article image set
          - { width: 660, height: 440 }   # web list article image set
          - { width: 150, height: 100 }   # web list article image set
          - { width: 240, height: 160 }   # web list article image set
          - { width: 300, height: 200 }   # web list article image set
          - { width: 450, height: 300 }   # web list article image set
          - { width: 75, height: 75 }     # web list article image set
          - { width: 100, height: 100 }   # web article author
          - { width: 200, height: 200 }   # web article author
