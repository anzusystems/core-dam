anzu_systems_core_dam:
  settings:
    api_domain: '%env(resolve:string:DOMAIN_CORE_DAM_API)%'
    youtube_api_key: '%env(resolve:string:YOUTUBE_API_KEY)%'
    elastic_index_prefix: '%env(resolve:string:ELASTIC_INDEX_PREFIX)%'
    elastic_language_dictionaries: ['sk']
    distribution_auth_redirect_url: '%env(resolve:string:DISTRIBUTION_AUTH_REDIRECT_URL)%'
    default_ext_system_id: 1
    default_asset_licence_id: 100000
    allow_select_ext_system: true
    allow_select_licence: true
    admin_allow_list_name: 'admin'
    max_bulk_item_count: 10
    acl_check_enabled: true
    app_redis: DamRedis
    cache_redis: CacheRedis
    user_auth_type: oauth2
    limited_asset_licence_files_count: 100
    notifications:
      gps_config:
        transport: rest
    image_chunk_config:
      min_size: '%env(byte_size:APP_SIZE_MIN_CHUNK_SIZE)%'
      max_size: '%env(byte_size:APP_SIZE_MAX_CHUNK_SIZE)%'
  display_title:
    image:
      - 'customData:title'
      - 'customData:headline'
      - 'assetTexts:title'
      - 'assetFileAttributes:originFileName'
      - 'asset:id'
      - 'assetFile:id'
      - 'assetTexts:title'
    audio:
      - 'customData:title'
      - 'customData:headline'
      - 'assetTexts:title'
      - 'assetFileAttributes:originFileName'
      - 'asset:id'
      - 'assetFile:id'
      - 'assetTexts:title'
    video:
      - 'customData:title'
      - 'customData:headline'
      - 'assetTexts:title'
      - 'assetFileAttributes:originFileName'
      - 'asset:id'
      - 'assetFile:id'
      - 'assetTexts:title'
    document:
      - 'customData:title'
      - 'customData:headline'
      - 'assetTexts:title'
      - 'assetFileAttributes:originFileName'
      - 'asset:id'
      - 'assetFile:id'
      - 'assetTexts:title'
  file_operations:
    tmp_dir_path: '/tmp'
    fixtures_dir_path: '%kernel.project_dir%/var/mnt/data/fixtures'
  exif_metadata:
    common_metadata:
      Software:
        autoFillField: 'title'
      ExifVersion:
        autoFillField: 'title'
      Make: ~
      Artist: ~
      Description: ~
      Rights: ~
      Title: ~
      Subject: ~
      Headline: ~
      City: ~
      Credit: ~
      Source: ~
      State: ~
      Creator: ~
      Country: ~
      DateCreated: ~
      Keywords: ~
      OwnerName: ~
    image_metadata:
      ColorSpace:
        autoFillField: 'description'
      Flash: ~
      ImageDescription: ~
  image_settings:
    optimal_resizes: [ 2000, 1000, 500, 100 ]
    enable_crop_cache: true  # todo implement
    color_set:
      red:
        rgb: [238, 2, 2]
      yellow:
        rgb: [251, 239, 0]
      blue:
        rgb: [30, 21, 246]
      orange:
        rgb: [244, 114, 0]
      green:
        rgb: [46, 145, 2]
      purple:
        rgb: [158, 11, 246]
      white:
        rgb: [255, 255, 255]
      black:
        rgb: [0, 0, 0]
      pink:
        rgb: [210, 7, 151]
      brown:
        rgb: [154, 0, 5]
    crop_allow_list:
      admin:
        domains: [ admin ]
        quality_whitelist: [ ]
        crops:
          - { width: 300, height: 200, tags: ['roi_example'], title: '3:2' }  # admin roi example 3:2
          - { width: 0, height: 200, tags: ['list'] }           # admin DAM listing
          - { width: 200, height: 200, tags: ['roi_example'], title: '1:1' }  # admin roi example 1:1
          - { width: 1920, height: 0, tags: ['detail', 'artemis_distribution'] }        # admin DAM image crop
          - { width: 0, height: 600 }        # UGC DAM image preview
          - { width: 500, height: 281 }      # UGC DAM image preview after upload
          - { width: 972, height: 648 }   # blog web listing small image set (TODO remove when we change the domain on web-blog)
          - { width: 600, height: 450 }   # blog web gallery image set (TODO remove when we change the domain on web-blog)
          - { width: 480, height: 360 }   # blog web gallery image set (TODO remove when we change the domain on web-blog)
          - { width: 360, height: 270 }   # blog web gallery image set (TODO remove when we change the domain on web-blog)
          - { width: 240, height: 180 }   # blog web gallery image set (TODO remove when we change the domain on web-blog)
          - { width: 120, height: 90 }   # blog web gallery image set (TODO remove when we change the domain on web-blog)
          - { width: 450, height: 300 }   # blog web listing small image set (TODO remove when we change the domain on web-blog)
          - { width: 100, height: 100 }   # blog web listing small image set (TODO remove when we change the domain on web-blog)
          - { width: 200, height: 200 }   # blog web listing small image set (TODO remove when we change the domain on web-blog)
          - { width: 1024, height: 0 }   # blog web article detail image set (automatic height) (TODO remove when we change the domain on web-blog)
          - { width: 970, height: 0 }   # blog web article detail image set (automatic height) (TODO remove when we change the domain on web-blog)
          - { width: 608, height: 0 }   # blog web article detail image set (automatic height) (TODO remove when we change the domain on web-blog)
          - { width: 448, height: 0 }   # blog web article detail image set (automatic height) (TODO remove when we change the domain on web-blog)
          - { width: 288, height: 0 }   # blog web article detail image set (automatic height) (TODO remove when we change the domain on web-blog)
          - { width: 300, height: 300 }   # blog mobile app (TODO remove when we change the domain on web-blog)
      web_cms:
        domains: [ web_cms ]
        quality_whitelist: [ 90 ]
        crops:
          - { width: 800, height: 450 }   # anzu web general
          - { width: 350, height: 197 }   # anzu web box item photo
          - { width: 972, height: 648 }   # blog web listing small image set
          - { width: 600, height: 450 }   # blog web gallery image set
          - { width: 480, height: 360 }   # blog web gallery image set
          - { width: 360, height: 270 }   # blog web gallery image set
          - { width: 240, height: 180 }   # blog web gallery image set
          - { width: 120, height: 90 }   # blog web gallery image set
          - { width: 450, height: 300 }   # blog web listing small image set
          - { width: 100, height: 100 }   # blog web listing small image set
          - { width: 200, height: 200 }   # blog web listing small image set
          - { width: 1024, height: 0 }   # blog web article detail image set (automatic height)
          - { width: 970, height: 0 }   # blog web article detail image set (automatic height)
          - { width: 608, height: 0 }   # blog web article detail image set (automatic height)
          - { width: 448, height: 0 }   # blog web article detail image set (automatic height)
          - { width: 288, height: 0 }   # blog web article detail image set (automatic height)
          - { width: 300, height: 300 }   # blog mobile app
  ext_systems:
    cms:
      id: 1
      asset_external_providers:
        unsplash_cms:
          title: Unsplash
          import_author_id: 0185f3e8-7f5e-750e-9075-29cdd412b988
      image:
        enabled: true
        title: ['customData:title']
        custom_metadata_pinned_amount: 3
        storage_name: 'cms.image'
        crop_storage_name: 'cms.crop'
        chunk_storage_name: 'cms.image'
        size_limit: '%env(byte_size:APP_CMS_IMAGE_MAX_SIZE)%'
        roi_width: 16
        roi_height: 9
        file_slots:
          default: default
          slots: [ default, free, extra ]
        keywords:
          enabled: true
          required: false
          autocomplete_from_exif_metadata_tags:
            Keywords: ','
            Subjects: ','
        authors:
          enabled: true
          required: false
          autocomplete_from_exif_metadata_tags:
            Artist: ','
            Owners: ','
            OwnerName: ~
        asset_external_providers_map:
          title:
            source_property_path: 'texts.displayTitle'
            destination_property_path: 'metadata.customData[title]'
          description:
            source_property_path: 'texts.description'
            destination_property_path: 'metadata.customData[description]'
            normalizers:
              - { type: string, options: { length: 5000 } }
      audio:
        enabled: true
        keywords:
          enabled: true
          required: false
          autocomplete_from_exif_metadata_tags:
            Keywords: ','
            Subjects: ','
        authors:
          enabled: true
          required: false
          autocomplete_from_exif_metadata_tags:
            Artist: ','
            Owners: ','
            OwnerName: ~
        title: ['customData:title']
        custom_metadata_pinned_amount: 3
        public_domain_name: '%env(resolve:string:AUDIO_CMS_WEB)%'
        storage_name: 'cms.audio'
        public_storage: 'cms.public_audio'
        chunk_storage_name: 'cms.audio'
        size_limit: '%env(byte_size:APP_CMS_AUDIO_MAX_SIZE)%'
        distribution:
          distribution_services: [ artemis_podcast_cms ]
          distribution_requirements:
            artemis_podcast_cms:
              title: 'Artemis Podcasty'
              blocked_by: [ ]
              strategy: none
              distribution_metadata_map:
                title:
                  source_property_path: 'metadata.customData[title]'
                  destination_property_path: 'texts.title'
                description:
                  source_property_path: 'metadata.customData[description]'
                  destination_property_path: 'texts.description'
                keywords:
                  source_property_path: 'keywords_as_string_array'
                  destination_property_path: 'texts.keywords'
                authors:
                  source_property_path: 'authors_as_string_array'
                  destination_property_path: 'texts.authors'
              category_select:
                enabled: true
                required: true
        file_slots:
          default: free
          slots: [ free, paid ]
        podcast_episode_rss_map:
          title:
            source_property_path: 'title'
            destination_property_path: 'metadata.customData[title]'
            normalizers:
              - { type: string, options: { length: 64 } }
              - { type: html, options: { words_wrap: 0 } }
          description:
            source_property_path: 'description'
            destination_property_path: 'metadata.customData[description]'
            normalizers:
              - { type: string, options: { length: 5000 } }
              - { type: html, options: { words_wrap: 0 } }
        podcast_episode_entity_map:
          title:
            source_property_path: 'metadata.customData[title]'
            destination_property_path: 'texts.title'
          description:
            source_property_path: 'metadata.customData[description]'
            destination_property_path: 'texts.description'
      video:
        enabled: true
        keywords:
          enabled: true
          required: false
          autocomplete_from_exif_metadata_tags:
            Keywords: ','
            Subjects: ','
        authors:
          enabled: true
          required: false
          autocomplete_from_exif_metadata_tags:
            Artist: ','
            Owners: ','
            OwnerName: ~
        title: ['customData:title']
        video_episode_entity_map:
          title:
            source_property_path: 'metadata.customData[title]'
            destination_property_path: 'texts.title'
        custom_metadata_pinned_amount: 3
        storage_name: 'cms.video'
        chunk_storage_name: 'cms.video'
        size_limit: '%env(byte_size:APP_CMS_VIDEO_MAX_SIZE)%'
        file_slots: ~
        distribution:
          distribution_services: [ youtube_cms_main, youtube_cms_fici, jw_cms, artemis_video_cms ]
          distribution_requirements:
            youtube_cms_main:
              title: 'YouTube CMS'
              blocked_by: []
              strategy: none
              distribution_metadata_map:
                title:
                  source_property_path: 'metadata.customData[title]'
                  destination_property_path: 'texts.title'
                  normalizers:
                    - { type: string, options: { empty_string: true } }
                description:
                  source_property_path: 'metadata.customData[description]'
                  destination_property_path: 'texts.description'
                  normalizers:
                    - { type: string, options: { empty_string: true } }
                keywords:
                  source_property_path: 'keywords_as_string_array'
                  destination_property_path: 'texts.keywords'
              category_select:
                enabled: true
                required: false
            youtube_cms_fici:
              title: 'YouTube Fičí'
              distribution_metadata_map:
                title:
                  source_property_path: 'metadata.customData[title]'
                  destination_property_path: 'texts.title'
                  normalizers:
                    - { type: string, options: { empty_string: true } }
                description:
                  source_property_path: 'metadata.customData[description]'
                  destination_property_path: 'texts.description'
                  normalizers:
                    - { type: string, options: { empty_string: true } }
                keywords:
                  source_property_path: 'keywords_as_string_array'
                  destination_property_path: 'texts.keywords'
              blocked_by: [ ]
              strategy: none
            jw_cms:
              title: 'JW Player Video'
              distribution_metadata_map:
                title:
                  source_property_path: 'metadata.customData[title]'
                  destination_property_path: 'texts.title'
                  normalizers:
                    - { type: string, options: { empty_string: true } }
                description:
                  source_property_path: 'metadata.customData[description]'
                  destination_property_path: 'texts.description'
                  normalizers:
                    - { type: string, options: { empty_string: true } }
                keywords:
                  source_property_path: 'keywords_as_string_array'
                  destination_property_path: 'texts.keywords'
                author:
                  source_property_path: 'authors_as_string_array[0]'
                  destination_property_path: 'texts.null_author'
              blocked_by: [ ]
              strategy: none
              category_select:
                enabled: true
                required: false
            artemis_video_cms:
              title: 'Artemis'
              blocked_by: [youtube_cms_main, youtube_cms_fici, jw_cms]
              strategy: at_least_one # none, one_from_type, wait_for_all
              distribution_metadata_map:
                title:
                  source_property_path: 'metadata.customData[title]'
                  destination_property_path: 'texts.title'
                description:
                  source_property_path: 'metadata.customData[description]'
                  destination_property_path: 'texts.description'
                keywords:
                  source_property_path: 'keywords_as_string_array'
                  destination_property_path: 'texts.keywords'
                authors:
                  source_property_path: 'authors_as_string_array'
                  destination_property_path: 'texts.authors'
              category_select:
                enabled: true
                required: true
      document:
        enabled: true
        title: ['customData:title']
        custom_metadata_pinned_amount: 3
        storage_name: 'cms.document'
        chunk_storage_name: 'cms.document'
        size_limit: '%env(byte_size:APP_CMS_DOCUMENT_MAX_SIZE)%'
        file_slots: ~
    blog:
      id: 4
      image:
        enabled: true
        title: ['customData:title']
        custom_metadata_pinned_amount: 2
        storage_name: 'blog.image'
        crop_storage_name: 'blog.crop'
        chunk_storage_name: 'blog.chunk'
        size_limit: '%env(byte_size:APP_CMS_BLOG_MAX_SIZE)%'
        roi_width: 16
        roi_height: 9
        file_slots:
          default: default
          slots: [ default ]
  domains:
    admin:
      domain: '%env(resolve:string:DOMAIN_ADMIN_WEB)%'
    web_cms:
      domain: '%env(resolve:string:DOMAIN_CMS_WEB)%'
