security:
    enable_authenticator_manager: true
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: id
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_USER: ~
        ROLE_SYS_API: ~
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        pub:
            pattern: ^(/api/pub/)
            security: false
    #        adm:
    #            pattern: ^(/api/adm/)
    #            stateless: true
    #            custom_authenticators:
    #                - Anzu\AuthenticationBundle\Authenticator\JwtAdminAuthenticator
    #        sys:
    #            pattern: ^/api/sys
    #            stateless: true
    #            custom_authenticators:
    #                - App\Security\Authentication\SysAuthenticator

    access_control:
        - { path: ^/api/pub, roles: IS_AUTHENTICATED_ANONYMOUSLY }
#        - { path: ^/api/adm, roles: IS_AUTHENTICATED_FULLY }
#        - { path: ^/api/sys, roles: ROLE_SYS_API }
