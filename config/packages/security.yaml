security:
    providers:
        app_user_provider_email:
            entity:
                class: App\Entity\User
                property: email
        app_user_provider_id:
            entity:
                class: App\Entity\User
                property: id
        app_user_provider_sso_id:
            entity:
                class: App\Entity\User
                property: ssoId
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_USER: ~
        ROLE_SYS_API: ~
    password_hashers:
        App\Entity\User: 'auto'
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        pub:
            pattern: ^/api/pub/
            security: false
        auth:
            pattern: ^/api/auth/
            stateless: true
            security: false
            logout:
                path: auth_logout
        adm:
            pattern: ^((/api/adm/)|(/adm/))
            stateless: true
            provider: app_user_provider_id
            custom_authenticators:
                - AnzuSystems\AuthBundle\Security\Authentication\JwtAuthentication
        ugc:
            pattern: ^/api/ugc/
            stateless: true
            provider: app_user_provider_sso_id
            entry_point: App\Security\Authenticator\UgcAuthenticator
            custom_authenticators:
                - App\Security\Authenticator\UgcAuthenticator
                - App\Security\Authenticator\UgcImpAuthenticator
        sys:
            pattern: ^/api/sys/
            stateless: true
            provider: app_user_provider_id
            custom_authenticators:
                - AnzuSystems\AuthBundle\Security\Authentication\ApiTokenAuthenticator

    access_control:
        - { path: ^/api/pub/, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/, roles: PUBLIC_ACCESS }
        - { path: ^/api/adm/, roles: ROLE_USER }
        - { path: ^/api/ugc/, roles: ROLE_USER }
        - { path: ^/adm/, roles: ROLE_USER }
        - { path: ^/api/sys/, roles: ROLE_SYS_API }
